<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#071419"
  >

  <title>
    Bass Finder Wales V3
  </title>

  <link
    rel="stylesheet"
    href="./styles.css"
  >
</head>


<body>

  <div class="app-shell">

    <header class="topbar">

      <div>

        <div class="eyebrow">
          BASS FINDER WALES
        </div>

        <h1>
          Find the best bass opportunity.
        </h1>

        <p class="subtitle">
          Live conditions, Fishing DNA
          and real-world catch evidence.
        </p>

      </div>

      <div class="version-pill">
        V3
      </div>

    </header>


    <main
      id="app"
      class="content"
      aria-live="polite"
    >

      <section class="startup-card">

        <div class="startup-icon">
          ◉
        </div>

        <h2>
          Bass Finder Wales V3
        </h2>

        <p>
          Intelligence engine starting…
        </p>

      </section>

    </main>


    <nav
      class="bottom-nav"
      aria-label="Primary navigation"
    >

      <button
        class="nav-button active"
        data-view="now"
        type="button"
      >

        <span class="nav-icon">
          ◎
        </span>

        <strong>
          NOW
        </strong>

      </button>


      <button
        class="nav-button"
        data-view="planner"
        type="button"
      >

        <span class="nav-icon">
          ▦
        </span>

        <strong>
          7 DAYS
        </strong>

      </button>


      <button
        class="nav-button"
        data-view="marks"
        type="button"
      >

        <span class="nav-icon">
          ⌖
        </span>

        <strong>
          MARKS
        </strong>

      </button>

    </nav>

  </div>

<script src="./utils.js"></script>
<script src="./marks.js"></script>
<script src="./mark-profiles.js"></script>
<script src="./forecast.js"></script>
<script src="./tides.js"></script>
<script src="./scoring.js"></script>
<script src="./app.js"></script>
  

</body>

</html>

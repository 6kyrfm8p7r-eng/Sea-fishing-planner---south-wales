name: Bass Report Collector

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run collector
        run: node v3/collector-runner.js
      - name: Save collector data
        run: |
          if [ -z "$(git status --porcelain -- v3/data/bass-reports.json v3/data/bass-reports.js)" ]; then
            echo "No collector data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add v3/data/bass-reports.json
          git add v3/data/bass-reports.js

          git commit -m "Update bass report data"
          git push
